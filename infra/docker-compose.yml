services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: lps
      POSTGRES_USER: lps
      POSTGRES_PASSWORD: lps_password
    ports: ["5432:5432"]
    volumes: ["lps_pg:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U lps -d lps"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  lps_pg:
